[project]
name = "road-risk-backend"
version = "0.1.0"
description = "Prototype Backend — Road Risk & Accessibility System for NER India"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "geoalchemy2>=0.14.0",
    "shapely>=2.0.0",
    "osmium>=4.3.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.2.3",
    "psycopg[binary]>=3.3.5",
    "pyproj>=3.7.1",
    "rasterio>=1.4.4",
    "numpy>=2.2.6",
    "requests>=2.34.2",
    "xgboost>=3.2.0",
    "scikit-learn>=1.7.2",
    "joblib>=1.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["data*", "models*"]

